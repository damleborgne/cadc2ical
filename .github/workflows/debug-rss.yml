name: Debug CADC RSS

on:
  push:
    paths:
      - ".github/workflows/debug-rss.yml"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print first RSS item
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          urls = [
              'https://www1.cadc-ccda.hia-iha.nrc-cnrc.gc.ca/meetings/rssFeed',
              'https://www.cadc-ccda.hia-iha.nrc-cnrc.gc.ca/meetings/rssFeed',
              'https://cadcwww.dao.nrc.ca/meetings/rssFeed',
          ]
          for url in urls:
              try:
                  data = urllib.request.urlopen(url, timeout=20).read()
                  root = ET.fromstring(data)
                  item = next(root.iter('item'))
                  print('URL:', url)
                  print(ET.tostring(item, encoding='unicode'))
                  break
              except Exception as e:
                  print('FAILED', url, repr(e))
          PY
